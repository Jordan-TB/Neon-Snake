<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon-Snake</title>
<link rel="icon" type="image/png" href="Neon-Snake.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Audiowide">

<style>
    body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        height: 100vh;
        background-image: url("Vaporwave.png");
	background-size: cover;
	background-position: center;
	background-repeat: no-repeat;
	background-attachment: fixed;
  
    );


        color: green;
        font-family: "Audiowide", sans-serif;
	cursor: none;
    }

h1 {
    margin-bottom:10px;
    font-size: 64px;
    color: #00ffee;
    text-shadow:
        0 0 10px #fb00ff,
	0 0 20px #fb00ff,
        0 0 30px #fb00ff;

    animation: breathe 2s ease-in-out infinite;
}

@keyframes breathe {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.1);
    }
}

   #score {

    	font-size: 44px;
    	font-weight: bold;
    	color: blue;
    	text-shadow:
        	0 0 10px #00ffee,
		0 0 20px #00ffee,
        	0 0 30px #00ffee;
}

   #author {
    	font-size: 24px;
    	font-weight: bold;
    	color: blue;
    	text-shadow:
        	0 0 5px #00ffee,
        	0 0 10px #00ffee,
        	0 0 20px #00ffee;
}

    canvas {
        border: 3px solid white;
        background: #222;
	cursor: none;
    }

    #message {
        margin-top: 10px;
        color: #ff5555;
        font-size: 18px;
    }

.game-container {
    position: relative;

    padding: 5px;

    border: 2px solid #00ffee;

    border-radius: 10px;

    background: rgba(0, 20, 40, 0.8);

    box-shadow:
        0 0 5px #00ffee,
        0 0 10px #00ffee,
        0 0 20px #00ffee;
}

.game-layout {
    display: flex;
    align-items: flex-start;
    gap: 20px;
}

#pickupKey {

    width: 220px;

    padding: 15px;

    border: 2px solid #00ffee;

    background: rgba(0, 20, 40, 0.8);

    border-radius: 10px;

    color: #00ffee;

    text-shadow:
        0 0 5px #00ffee,
        0 0 10px #00ffee;
}

#topScores {

    width: 220px;

    padding: 15px;

    border: 2px solid #fb00ff;

    background: rgba(40, 0, 60, 0.8);

    border-radius: 10px;

    color: #00ffee;

    text-shadow:
        0 0 5px #00ffee,
        0 0 10px #00ffee;
}

#topScores h3 {

    margin-top: 0;

    text-align: center;

    font-size: 20px;

    color: #fb00ff;
}

#scoreList {

    line-height: 2;

    font-size: 16px;
}

#pickupKey h3 {

    margin-top: 0;

    text-align: center;

    color: #00ffee;

    font-size: 24px;

    text-shadow:
        0 0 5px #fb00ff,
        0 0 10px #fb00ff,
        0 0 20px #fb00ff;
}

.pickupEntry {

    margin-bottom: 20px;

    padding-bottom: 10px;

    border-bottom: 1px solid rgba(255,255,255,0.2);

    font-size: 16px;

    line-height: 1.5;
}

#gameOverOverlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 710px;
    height: 710px;

    display: none;
    justify-content: center;
    align-items: center;

    background: rgba(20, 0, 40, 0.75);
    backdrop-filter:blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 100;

    text-align: center;
    font-size: 40px;
    font-weight: bold;

    flex-direction: column;
}

#gameOverText {
    padding: 20px;
    color: #2bfff1;
    text-shadow:
        0 0 10px #ff00e6,
	0 0 20px #ffffff;
	0 0 30px #00ff0d;
}

#startOverlay {
    position: absolute;
    top: 0;
    left: 0;

    width: 710px;
    height: 710px;

    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;

    background: rgba(20, 0, 40, 0.85);

    z-index: 200;
}

#startText {
    text-align: center;

    color: blue;

    font-size: 42px;
    font-weight: bold;

    text-shadow:
        0 0 10px #00ffee,
        0 0 20px #00ffee,
        0 0 30px #00ffee;

    animation: startPulse 1.5s infinite;
}

#powerupTimer {
    font-size: 24px;
    font-weight: bold;
    min-height: 30px;

    color: #ffff00;

    text-shadow:
        0 0 10px #ffff00,
        0 0 20px #ffff00;
}

#healthContainer {
    width: 400px;
    height: 20px;

    border: 2px solid #00ffee;

    background: #111;

    margin: 10px 0;

    overflow: hidden;
}

#healthBar {
    width: 100%;
    height: 100%;

    background: linear-gradient(
        90deg,
        #00ff00,
        #ffff00,
        #ff0000
    );

    transition: width 0.1s linear;
}

@keyframes startPulse {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.05);
    }
}

</style>
</head>
<body>

<h1>🚨NEON-SNAKE🐍</h1>
<div id="score">Score: 0</div>
<div id="healthContainer">
    <div id="healthBar"></div>
</div>
<div id="powerupTimer"></div>
<div class="game-layout">

   <div id="topScores">

    <h3>Your Top Scores</h3>

    <div id="scoreList">
        No scores yet
    </div>

</div>

    <div class="game-container">

        <div id="startOverlay">
            <div id="startText">
                🚨 NEON-SNAKE 🐍
                <br><br>
                Press SPACE to Start
                <br><br>
                <span style="font-size:24px;">
                    Use Arrow Keys or WASD to Move
                </span>
            </div>
        </div>

        <canvas id="game" width="700" height="700"></canvas>

        <div id="gameOverOverlay">
            <div id="gameOverText"></div>
        </div>

    </div>

    <div id="pickupKey">

        <h3>Pickups</h3>

        <div class="pickupEntry">
            🍎 Apple<br>
            +1 Score<br>
	    Replenish Hunger
        </div>

        <div class="pickupEntry">
            🌟 Golden Apple<br>
            +5 Score
        </div>

        <div class="pickupEntry">
            ⚡ Lightning Bolt<br>
            Speed Boost<br>
            2× Points
        </div>

	<div id="author">by Jordan-TB</div>

    </div>

</div>

<div id="message"></div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const gridSize = 35;
const tileCount = canvas.width / gridSize;

const foodImg = new Image();
foodImg.src = "Apple.png";

const goldenAppleImg = new Image();
goldenAppleImg.src = "Golden-Apple.png";

const lightningImg = new Image();
lightningImg.src = "Lightning-Bolt.png";

let snake;

//apples
let food;

//Golden apple
let goldenApple = null;
let goldenAppleTimer = 0;
let dx;
let dy;
let score;
let gameOver;
let gameLoop;

//Particle effects
let particles = [];

//Speed boost pickup
let lightningBolt = null;
let lightningTimer = 0;

let boosted = false;

const NORMAL_SPEED = 100;
const BOOST_SPEED = 50;

//Health variables
let health;
const MAX_HEALTH = 100;


//FPS counter
let fps = 0;
let frameCount = 0;
let lastFpsUpdate = performance.now();

let gameStarted = false;

//Queued inputs to prevent false deaths
let directionQueue = [];

let topScores =
    JSON.parse(
        localStorage.getItem("snakeTopScores")
    ) || [];

function initGame() {

//Golden apple timer
goldenApple = null;
goldenAppleTimer = 0;

//lightning bolt timer
lightningBolt = null;
lightningTimer = 0;
boosted = false;

//Health reset
health = MAX_HEALTH;
document.getElementById("healthBar").style.width = "100%";

document.getElementById("powerupTimer").textContent = "";

const startX = Math.floor(Math.random() * (tileCount - 6)) + 2;
const startY = Math.floor(Math.random() * (tileCount - 6)) + 2;

snake = [
    { x: startX, y: startY }
];

    food = randomFood();

const directions = [
    { dx: 1, dy: 0 },   // Right
    { dx: -1, dy: 0 },  // Left
    { dx: 0, dy: 1 },   // Down
    { dx: 0, dy: -1 }   // Up
];

const dir = directions[Math.floor(Math.random() * directions.length)];

dx = dir.dx;
dy = dir.dy;

    score = 0;
    gameOver = false;

    document.getElementById("score").textContent = "Score: 0";
    document.getElementById("message").textContent = "";
    document.getElementById("gameOverOverlay").style.display = "none";

    clearInterval(gameLoop);
    gameLoop = setInterval(update, 100);
}

updateLeaderboard();

function randomFood() {
    return {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
    };
}

function update() {

if (directionQueue.length > 0) {

    const nextMove = directionQueue.shift();

    if (
        !(nextMove.dx === -dx && nextMove.dy === -dy)
    ) {
        dx = nextMove.dx;
        dy = nextMove.dy;
    }
}
    if (gameOver) return;

    const head = {
        x: snake[0].x + dx,
        y: snake[0].y + dy
    };

 //Health drain
 health -= boosted ? 0.25 : 0.5;

 if (health <= 0) {

    health = 0;

    endGame("You Starved!");

    return;
}

const healthBar =
    document.getElementById("healthBar");

healthBar.style.width = health + "%";

if (health > 60) {

    healthBar.style.background = "#00ff00";

}
else if (health > 30) {

    healthBar.style.background = "#ffff00";

}
else {

    healthBar.style.background = "#ff0000";
}


    // Wall collision
    if (
        head.x < 0 ||
        head.y < 0 ||
        head.x >= tileCount ||
        head.y >= tileCount
    ) {
        endGame();
        return;
    }

    // Self collision
    for (let segment of snake) {
        if (head.x === segment.x && head.y === segment.y) {
            endGame();
            return;
        }
    }

    snake.unshift(head);

particles.forEach(p => {
    p.life -= 0.03;
    p.size *= 0.98;
});

particles = particles.filter(p => p.life > 0);

// Golden apple spawn
if (!goldenApple && Math.random() < 0.005) {

    do {
        goldenApple = {
            x: Math.floor(Math.random() * tileCount),
            y: Math.floor(Math.random() * tileCount)
        };
    } while (
        snake.some(seg =>
            seg.x === goldenApple.x &&
            seg.y === goldenApple.y
        ) ||
        (
            goldenApple.x === food.x &&
            goldenApple.y === food.y
        )
    );

    goldenAppleTimer = 80;
}

// Golden Apple collision
if (
    goldenApple &&
    head.x === goldenApple.x &&
    head.y === goldenApple.y
) {

    score += boosted ? 10 : 5;

    document.getElementById("score").textContent =
        "Score: " + score;

    goldenApple = null;
}

//Golden apple timer
if (goldenApple) {

    goldenAppleTimer--;

    if (goldenAppleTimer <= 0) {
        goldenApple = null;
    }
}

//Spawn lightning bolt
if (!lightningBolt && Math.random() < 0.01) {

    lightningBolt = {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
    };
}

//Lightning bolt collision
if (
    lightningBolt &&
    head.x === lightningBolt.x &&
    head.y === lightningBolt.y
) {

    lightningBolt = null;

    boosted = true;

    lightningTimer = 100;

    clearInterval(gameLoop);
    gameLoop = setInterval(update, BOOST_SPEED);
}

//Lightning timer handler
if (boosted) {

    lightningTimer--;

	document.getElementById("powerupTimer").textContent =
    		"⚡ OVERCHARGE: " +
    		(lightningTimer / 10).toFixed(1) +
    "s";

    if (lightningTimer <= 0) {

        boosted = false;

	document.getElementById("powerupTimer").textContent = "";

        clearInterval(gameLoop);
        gameLoop = setInterval(update, NORMAL_SPEED);
    }
}


// Eat food
if (head.x === food.x && head.y === food.y) {

    health = MAX_HEALTH;

    score += boosted ? 2 : 1;

    document.getElementById("score").textContent =
        "Score: " + score;

    do {
        food = randomFood();
    } while (
        snake.some(
            segment =>
                segment.x === food.x &&
                segment.y === food.y
        )
    );

} else {
    snake.pop();
}

    draw();
}

function updateLeaderboard() {

    const scoreList =
        document.getElementById("scoreList");

    if (topScores.length === 0) {

        scoreList.innerHTML = "No scores yet";
        return;
    }

    scoreList.innerHTML =
        topScores
            .map((score, index) => {

                let colour = "#00ffee";

if (index === 0)
    return `<div style="
        color:#FFD700;
        text-shadow:0 0 10px #FFD700;">
        🥇${score} Points
    </div>`;

if (index === 1)
    return `<div style="
        color:#C0C0C0;
        text-shadow:0 0 10px #C0C0C0;">
        🥈${score} Points
    </div>`;

if (index === 2)
    return `<div style="
        color:#CD7F32;
        text-shadow:0 0 10px #CD7F32;">
        🥉${score} Points
    </div>`;


                return `
                    <div style="color:${colour}">
                        #${index + 1} ${score} Points
                    </div>
                `;
            })
            .join("");
}

function draw() {

    // Background
	const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
	gradient.addColorStop(0, "#1a0033");
	gradient.addColorStop(1, "#003366");

	ctx.fillStyle = gradient;
	ctx.fillRect(0, 0, canvas.width, canvas.height);

	ctx.strokeStyle = "rgba(255,255,255,0.08)";

	for (let i = 0; i < canvas.width; i += gridSize) {
    	ctx.beginPath();
    	ctx.moveTo(i, 0);
    	ctx.lineTo(i, canvas.height);
    	ctx.stroke();

    	ctx.beginPath();
    	ctx.moveTo(0, i);
    	ctx.lineTo(canvas.width, i);
    	ctx.stroke();
}

ctx.fill();

ctx.shadowBlur = 0;

particles.forEach(p => {

    ctx.save();

    ctx.globalAlpha = p.life;

    ctx.shadowBlur = 15;
    ctx.shadowColor = "#00ffee";

    const hue = (Date.now() / 10 + p.x + p.y) % 360;
    ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;
    ctx.shadowColor = `hsl(${hue}, 100%, 50%)`;

    ctx.beginPath();
    ctx.arc(
        p.x,
        p.y,
        p.size,
        0,
        Math.PI * 2
    );
    ctx.fill();

    ctx.restore();
});


    // Food

    const pulse =
      Math.sin(Date.now() / 150) * 15;

   	ctx.shadowBlur = 20 + pulse;
	ctx.shadowColor = "#FF073A";


	ctx.drawImage(
    		foodImg,
    		food.x * gridSize,
    		food.y * gridSize,
    		gridSize,
   		gridSize
);

ctx.shadowBlur = 0;

// Golden Apple
if (goldenApple) {

    const pulse =
     (Math.sin(Date.now() / 150) + 1) * 4;

    ctx.shadowBlur = 25 + pulse;
    ctx.shadowColor = "#FFD700";

	ctx.drawImage(
	goldenAppleImg,
        goldenApple.x * gridSize - pulse / 2,
        goldenApple.y * gridSize - pulse / 2,
        gridSize + pulse,
        gridSize + pulse
    );

  }


//Lightning bolt
if (lightningBolt) {

    const pulse =
        (Math.sin(Date.now() / 100) + 1) * 4;

    ctx.save();

    ctx.shadowBlur = 20 + pulse;
    ctx.shadowColor = "#ffff00";

    ctx.drawImage(
        lightningImg,
        lightningBolt.x * gridSize,
        lightningBolt.y * gridSize,
        gridSize,
        gridSize
    );

    ctx.restore();
}

// RESET SHADOWS
ctx.shadowBlur = 0;
ctx.shadowColor = "transparent";

    // Snake
snake.forEach((segment, index) => {

    const hue = (index * 18 + Date.now() / 50) % 360;

    if (boosted) {

    const electricHue =
        (Date.now() / 5) % 360;

    ctx.fillStyle =
        `hsl(${electricHue},100%,70%)`;

    ctx.shadowBlur = 20;
    ctx.shadowColor = "#ffff00";
}
else {

    ctx.fillStyle =
        `hsl(${hue},100%,50%)`;

    ctx.shadowBlur = 0;
}

    ctx.fillRect(
        segment.x * gridSize + 1,
        segment.y * gridSize + 1,
        gridSize - 2,
        gridSize - 2
    );
});

ctx.shadowBlur = 2;

}

function endGame(reason = "Collision") {
    gameOver = true;

    topScores.push(score);

    topScores.sort((a, b) => b - a);

    topScores = topScores.slice(0, 3);

    localStorage.setItem(
        "snakeTopScores",
        JSON.stringify(topScores)
);

updateLeaderboard();
    clearInterval(gameLoop);

    const overlay = document.getElementById("gameOverOverlay");
    const text = document.getElementById("gameOverText");

text.innerHTML = `
    GAME OVER<br>
    ${reason}<br><br>
    Score: ${score}<br><br>
    Best: ${topScores[0] || score}<br>
    Press SPACE to Restart
`;

    overlay.style.display = "flex";
}

document.addEventListener("keydown", (e) => {
    const key = e.key;

    // Start Game
    if (!gameStarted && key === " ") {

        gameStarted = true;

        document.getElementById("startOverlay").style.display = "none";

        initGame();

        return;
    }

    // Restart Game
    if (gameOver && key === " ") {
        initGame();
        return;
    }

    // Prevent reversing direction
if (key === "ArrowUp" || key === "w" || key === "W") {
    directionQueue.push({ dx: 0, dy: -1 });
}
else if (key === "ArrowDown" || key === "s" || key === "S") {
    directionQueue.push({ dx: 0, dy: 1 });
}
else if (key === "ArrowLeft" || key === "a" || key === "A") {
    directionQueue.push({ dx: -1, dy: 0 });
}
else if (key === "ArrowRight" || key === "d" || key === "D") {
    directionQueue.push({ dx: 1, dy: 0 });
}
});

</script>

</body>
</html>
