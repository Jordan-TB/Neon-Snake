<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Clone</title>

<style>
    body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        height: 100vh;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
    }

    h1 {
        margin-bottom: 10px;
    }

    #score,
    #highScore {
    	font-size: 24px;
    	font-weight: bold;
    	color: #00ffee;
    	text-shadow:
        	0 0 5px #00ffee,
        	0 0 10px #00ffee,
        	0 0 20px #00ffee;
}

    canvas {
        border: 3px solid white;
        background: #222;
    }

    #message {
        margin-top: 10px;
        color: #ff5555;
        font-size: 18px;
    }

.game-container {
    position: relative;
}

#gameOverOverlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 710px;
    height: 710px;

    display: none;
    justify-content: center;
    align-items: center;

    background: rgba(20, 0, 40, 0.75);
    backdrop-filter:blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 100;

    text-align: center;
    font-size: 40px;
    font-weight: bold;

    flex-direction: column;
}

#gameOverText {
    padding: 20px;
    color: #ff66ff;
    text-shadow:
        0 0 10px #ff00ff,
	0 0 20px #ff00ff,
	0 0 30px #ff00ff;
}

</style>
</head>
<body>

<h1>SNAKE</h1>
<div id="score">Score: 0</div>
<div class="game-container">
	<canvas id="game" width="700" height="700"></canvas>

	<div id="gameOverOverlay">
		<div id="gameOverText"></div>
	</div>
<div id="highScore">High Score: 0</div>   <div id="fps">FPS: 0</div>
</div>

<div id="message"></div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const gridSize = 35;
const tileCount = canvas.width / gridSize;

let snake;
let food;
let dx;
let dy;
let score;
let gameOver;
let gameLoop;
let particles = [];
let fps = 0;
let frameCount = 0;
let lastFpsUpdate = performance.now();

let highScore = localStorage.getItem("snakeHighScore") || 0;

function initGame() {
    snake = [
        { x: 10, y: 10 }
    ];

    food = randomFood();

    dx = 1;
    dy = 0;

    score = 0;
    gameOver = false;

    document.getElementById("score").textContent = "Score: 0";
    document.getElementById("message").textContent = "";
    document.getElementById("gameOverOverlay").style.display = "none";

    clearInterval(gameLoop);
    gameLoop = setInterval(update, 100);
}

document.getElementById("highScore").textContent =
    "High Score: " + highScore;

function randomFood() {
    return {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
    };
}

function update() {
    if (gameOver) return;

    const head = {
        x: snake[0].x + dx,
        y: snake[0].y + dy
    };

    // Wall collision
    if (
        head.x < 0 ||
        head.y < 0 ||
        head.x >= tileCount ||
        head.y >= tileCount
    ) {
        endGame();
        return;
    }

    // Self collision
    for (let segment of snake) {
        if (head.x === segment.x && head.y === segment.y) {
            endGame();
            return;
        }
    }

    snake.unshift(head);

particles.forEach(p => {
    p.life -= 0.03;
    p.size *= 0.98;
});

particles = particles.filter(p => p.life > 0);


// Eat food
if (head.x === food.x && head.y === food.y) {

    score++;

    document.getElementById("score").textContent =
        "Score: " + score;

    // Update High Score
    if (score > highScore) {
        highScore = score;

        localStorage.setItem("snakeHighScore", highScore);

        document.getElementById("highScore").textContent =
            "High Score: " + highScore;
    }

    do {
        food = randomFood();
    } while (
        snake.some(
            segment =>
                segment.x === food.x &&
                segment.y === food.y
        )
    );

} else {
    snake.pop();
}

    draw();
}

function draw() {

frameCount++;

const now = performance.now();

if (now - lastFpsUpdate >= 1000) {
    fps = frameCount;

    document.getElementById("fps").textContent =
        "FPS: " + fps;

    frameCount = 0;
    lastFpsUpdate = now;
}


    // Background
	const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
	gradient.addColorStop(0, "#1a0033");
	gradient.addColorStop(1, "#003366");

	ctx.fillStyle = gradient;
	ctx.fillRect(0, 0, canvas.width, canvas.height);

	ctx.strokeStyle = "rgba(255,255,255,0.08)";

	for (let i = 0; i < canvas.width; i += gridSize) {
    	ctx.beginPath();
    	ctx.moveTo(i, 0);
    	ctx.lineTo(i, canvas.height);
    	ctx.stroke();

    	ctx.beginPath();
    	ctx.moveTo(0, i);
    	ctx.lineTo(canvas.width, i);
    	ctx.stroke();
}

ctx.fill();

ctx.shadowBlur = 0;

particles.forEach(p => {

    ctx.save();

    ctx.globalAlpha = p.life;

    ctx.shadowBlur = 15;
    ctx.shadowColor = "#00ffee";

    const hue = (Date.now() / 10 + p.x + p.y) % 360;
    ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;
    ctx.shadowColor = `hsl(${hue}, 100%, 50%)`;

    ctx.beginPath();
    ctx.arc(
        p.x,
        p.y,
        p.size,
        0,
        Math.PI * 2
    );
    ctx.fill();

    ctx.restore();
});

    // Food
   ctx.shadowBlur = 20;
	ctx.shadowColor = "#ff0080";

	ctx.fillStyle = "#ff3399";

	ctx.beginPath();
	ctx.arc(
    		food.x * gridSize + gridSize / 2,
    		food.y * gridSize + gridSize / 2,
    		gridSize / 2.5,
    		0,
    		Math.PI * 2
);
		ctx.fill();

    // Snake
snake.forEach((segment, index) => {

    const hue = (index * 18 + Date.now() / 50) % 360;

    ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;

    ctx.fillRect(
        segment.x * gridSize + 1,
        segment.y * gridSize + 1,
        gridSize - 2,
        gridSize - 2
    );
});

ctx.shadowBlur = 0;

}

function endGame() {
    gameOver = true;
    clearInterval(gameLoop);

    const overlay = document.getElementById("gameOverOverlay");
    const text = document.getElementById("gameOverText");

    text.innerHTML = `
        GAME OVER<br>
        Score: ${score}<br><br>
	<div>High Score: ${highScore}</div>
        Press SPACE to Restart
    `;

    overlay.style.display = "flex";
}

document.addEventListener("keydown", (e) => {
    const key = e.key;

    if (gameOver && key === " ") {
        initGame();
        return;
    }

    // Prevent reversing direction
    if (key === "ArrowUp" && dy !== 1) {
        dx = 0;
        dy = -1;
    } else if (key === "ArrowDown" && dy !== -1) {
        dx = 0;
        dy = 1;
    } else if (key === "ArrowLeft" && dx !== 1) {
        dx = -1;
        dy = 0;
    } else if (key === "ArrowRight" && dx !== -1) {
        dx = 1;
        dy = 0;
    }
});

initGame();
</script>

</body>
</html>
